<body>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; isolation: isolate; background: #E6E4DF; color: #1C1C1B; font-family: 'Inter Tight', 'Noto Sans SC', system-ui, sans-serif; font-weight: 400">

<header style="position: absolute; left: 40px; right: 40px; top: 26px; display: flex; align-items: center; justify-content: space-between; z-index: 6">
<a href="#top" aria-label="ClinkAI 首页" style="display: flex; align-items: baseline; gap: 3px; font-size: 24px; letter-spacing: -0.01em"><span>CLINKAI</span><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: #1C1C1B"></span></a>
<div style="display: flex; align-items: center; gap: 28px; font-size: 13px; letter-spacing: 0.02em"><a href="#services" style="">增长服务 ↗</a><a href="#work" style="">作品 ↗</a><a href="#products" style="">我们的产品 ↗</a><a href="#about" style="">关于我们 ↗</a>
<a href="#pilot" style="padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(28,28,27,0.35); display: flex; gap: 8px; align-items: center" aria-current="page">预约沟通<span aria-hidden="true">→</span></a>
</div>
</header>

<h1 lang="en" style="position: absolute; left: 40px; top: 104px; margin: 0; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-size: 190px; line-height: 0.9; font-weight: 400; letter-spacing: -0.04em">LET&#8217;S<br>TALK<span aria-hidden="true" style="display: inline-block; width: 110px; height: 110px; margin-left: 14px; border-radius: 50%; background: #1C1C1B"></span></h1>
<p style="position: absolute; left: 40px; top: 480px; width: 520px; margin: 0; font-size: 17px; line-height: 1.5">告诉我们你的品牌和想去的市场，我们会带着初步想法来聊。</p>
<dl style="position: absolute; left: 40px; bottom: 96px; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 15px">
<div style="display: flex; gap: 12px"><dt style="color: #5C5A55; width: 48px">邮箱</dt><dd style="margin: 0"><span style="display: inline-block; padding: 0 6px; border: 1px dashed rgba(28,28,27,0.5); border-radius: 4px; color: #5C5A55">【待填：邮箱】</span></dd></div>
<div style="display: flex; gap: 12px"><dt style="color: #5C5A55; width: 48px">微信</dt><dd style="margin: 0"><span style="display: inline-block; padding: 0 6px; border: 1px dashed rgba(28,28,27,0.5); border-radius: 4px; color: #5C5A55">【待填：微信号】</span></dd></div>
</dl>
<form style="position: absolute; left: 760px; right: 40px; top: 104px; display: flex; flex-direction: column; gap: 18px; z-index: 2">
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #5C5A55">品牌名</span><input type="text" name="brand" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(28,28,27,0.3); background: #F4F2EE; font: inherit; font-size: 16px; color: #1C1C1B"></label>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #5C5A55">官网或店铺链接</span><input type="url" name="site" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(28,28,27,0.3); background: #F4F2EE; font: inherit; font-size: 16px; color: #1C1C1B"></label>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px"><legend style="font-size: 13px; color: #5C5A55; padding: 0; margin-bottom: 8px">想去的市场</legend><div style="display: flex; flex-wrap: wrap; gap: 8px"><label style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(28,28,27,0.3); font-size: 14px; cursor: pointer"><input type="checkbox" name="market" value="北美" style="margin: 0; accent-color: #1C1C1B">北美</label><label style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(28,28,27,0.3); font-size: 14px; cursor: pointer"><input type="checkbox" name="market" value="欧洲" style="margin: 0; accent-color: #1C1C1B">欧洲</label><label style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(28,28,27,0.3); font-size: 14px; cursor: pointer"><input type="checkbox" name="market" value="中东" style="margin: 0; accent-color: #1C1C1B">中东</label><label style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(28,28,27,0.3); font-size: 14px; cursor: pointer"><input type="checkbox" name="market" value="东南亚" style="margin: 0; accent-color: #1C1C1B">东南亚</label><label style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(28,28,27,0.3); font-size: 14px; cursor: pointer"><input type="checkbox" name="market" value="日韩" style="margin: 0; accent-color: #1C1C1B">日韩</label><label style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(28,28,27,0.3); font-size: 14px; cursor: pointer"><input type="checkbox" name="market" value="拉美" style="margin: 0; accent-color: #1C1C1B">拉美</label><label style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(28,28,27,0.3); font-size: 14px; cursor: pointer"><input type="checkbox" name="market" value="其他" style="margin: 0; accent-color: #1C1C1B">其他</label></div></fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px"><legend style="font-size: 13px; color: #5C5A55; padding: 0; margin-bottom: 8px">需要哪些服务</legend><div style="display: flex; flex-wrap: wrap; gap: 8px"><label style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(28,28,27,0.3); font-size: 14px; cursor: pointer"><input type="checkbox" name="service" value="策略" style="margin: 0; accent-color: #1C1C1B">策略</label><label style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(28,28,27,0.3); font-size: 14px; cursor: pointer"><input type="checkbox" name="service" value="品牌" style="margin: 0; accent-color: #1C1C1B">品牌</label><label style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(28,28,27,0.3); font-size: 14px; cursor: pointer"><input type="checkbox" name="service" value="广告" style="margin: 0; accent-color: #1C1C1B">广告</label><label style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(28,28,27,0.3); font-size: 14px; cursor: pointer"><input type="checkbox" name="service" value="达人" style="margin: 0; accent-color: #1C1C1B">达人</label><label style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(28,28,27,0.3); font-size: 14px; cursor: pointer"><input type="checkbox" name="service" value="内容" style="margin: 0; accent-color: #1C1C1B">内容</label><label style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(28,28,27,0.3); font-size: 14px; cursor: pointer"><input type="checkbox" name="service" value="结果分析" style="margin: 0; accent-color: #1C1C1B">结果分析</label></div></fieldset>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #5C5A55">月预算</span><select name="budget" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(28,28,27,0.3); background: #F4F2EE; font: inherit; font-size: 16px; color: #1C1C1B"><option>【待填：预算区间】</option><option>先聊聊再说</option></select></label>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #5C5A55">怎么联系你</span><input type="text" name="contact" placeholder="微信 / 邮箱 / 电话" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(28,28,27,0.3); background: #F4F2EE; font: inherit; font-size: 16px; color: #1C1C1B"></label>
</div>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #5C5A55">补充说明（选填）</span><textarea name="note" rows="3" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(28,28,27,0.3); background: #F4F2EE; font: inherit; font-size: 16px; color: #1C1C1B; resize: vertical"></textarea></label>
<button type="button" style="align-self: flex-start; min-height: 50px; padding: 0 30px; border-radius: 999px; border: none; background: #1C1C1B; color: #E6E4DF; font: inherit; font-size: 16px; cursor: pointer">提交，预约沟通 →</button>
</form>

<span aria-hidden="true" style="position: absolute; left: 40px; bottom: 40px; width: 10px; height: 10px; border-radius: 50%; background: #1C1C1B; z-index: 5"></span>
<button type="button" aria-label="打开菜单" style="position: absolute; right: 40px; bottom: 32px; width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(28,28,27,0.25); background: #EEEDE9; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5">
<svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><path d="M0 1h18M0 6h18M0 11h18" stroke="#1C1C1B" stroke-width="1.4"></path></svg>
</button>

</div>
